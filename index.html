<style>
:root{--bg:#F5F7FA;--card:#fff;--tx:#020B2D;--mu:#5a6580;--ac:#0aa8c8;--bd:#dde3ee;--nv:#020B2D;--cy:#12D9FF;--lc:#E8FCFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#020B2D;--card:#0a1a4a;--tx:#fff;--mu:#9fb0d6;--ac:#12D9FF;--bd:#1b2f6b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--bg:#020B2D}}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;font:15px/1.6 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}.w{max-width:1100px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
nav{display:flex;align-items:center;gap:14px;height:60px;overflow-x:auto}nav img.wm{height:22px;border-radius:3px}nav a{white-space:nowrap;color:var(--mu);font-weight:600;font-size:13px}nav a.on,nav a:hover{color:var(--ac)}nav .sp{flex:1}
button,.btn{cursor:pointer;border:0;border-radius:8px;padding:9px 16px;font:600 14px inherit;background:var(--cy);color:#020B2D;display:inline-block}.btn.o,button.o{background:none;border:1px solid var(--bd);color:var(--tx)}button.d{background:#e5484d;color:#fff}button.s{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}label{font-size:12px;color:var(--mu);font-weight:600;display:block;margin:10px 0 3px}
.hero{padding:70px 0 50px;background:linear-gradient(160deg,var(--nv),#07226e);color:#fff}.hero h1{font-size:clamp(30px,6vw,56px);line-height:1.1;margin:10px 0;letter-spacing:-1px}.hero p{color:#b9c7ee;max-width:560px}.tag{color:var(--cy);letter-spacing:3px;font-size:12px;font-weight:700}
h2{font-size:26px;margin:40px 0 14px}.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.g.l{grid-template-columns:1fr}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:.2s}.c:hover{transform:translateY(-3px);border-color:var(--cy)}.c .b{padding:14px}.c h3{margin:2px 0 6px;font-size:17px}.l .c{display:flex}.l .th{width:220px;flex:none;height:auto}
.th{height:150px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;position:relative}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--lc);color:#056b82;margin:2px 3px 2px 0;font-weight:600}[data-theme=dark] .pill{background:#0f2a66;color:var(--cy)}.mu{color:var(--mu)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.bar>*{flex:1;min-width:130px}.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.st div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.st b{font-size:28px;color:var(--ac);display:block}
.vid{aspect-ratio:16/9;width:100%;border:0;background:#000;border-radius:10px}.pg{display:flex;gap:6px;justify-content:center;margin:20px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;vertical-align:top}
.md{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:20}.md>div{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:560px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--cy);color:#020B2D}
.tb{overflow-x:auto}footer{margin-top:60px;padding:30px 0;border-top:1px solid var(--bd);color:var(--mu);font-size:13px}.lb{cursor:zoom-in}

body{background-image:radial-gradient(900px 500px at 85% -10%,#12d9ff14,transparent),radial-gradient(700px 400px at -10% 30%,#2a4bff12,transparent);background-attachment:fixed}
header{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero{position:relative;overflow:hidden;padding:90px 0 80px;background:radial-gradient(700px 420px at 80% 40%,#12d9ff33,transparent),linear-gradient(160deg,#020B2D,#061a5c 70%,#020B2D)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#12d9ff12 1px,transparent 1px),linear-gradient(90deg,#12d9ff12 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 60% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 60% 40%,#000 20%,transparent 75%)}
.hg{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800}.hero h1 span{background:linear-gradient(90deg,#12D9FF,#7be9ff,#12D9FF);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.tag{display:inline-block;padding:5px 14px;border:1px solid #12d9ff55;border-radius:99px;background:#12d9ff12}
.lg{position:relative;display:flex;justify-content:center}.lg img{position:relative;width:min(100%,340px);aspect-ratio:1;border-radius:34px;border:1px solid #12d9ff66;box-shadow:0 0 0 8px #12d9ff0d,0 30px 80px #000a,0 0 90px #12d9ff40;animation:fl 6s ease-in-out infinite}
.ring{position:absolute;inset:-18px;margin:auto;width:min(100%,380px);aspect-ratio:1;border-radius:44px;background:conic-gradient(from 0deg,#12D9FF,transparent 30%,#12D9FF 60%,transparent);filter:blur(22px);opacity:.45;animation:rt 9s linear infinite}
@keyframes fl{50%{transform:translateY(-12px)}}@keyframes rt{to{transform:rotate(360deg)}}
.hs{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.hs span{font-size:12px;font-weight:700;letter-spacing:2px;padding:6px 14px;border-radius:8px;background:#ffffff10;border:1px solid #ffffff1f;color:#cfe;backdrop-filter:blur(6px)}
.btn{background:linear-gradient(135deg,#12D9FF,#5be7ff);box-shadow:0 6px 22px #12d9ff44;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px #12d9ff77}.btn.o{background:none;box-shadow:none}
h2{position:relative;padding-left:16px}h2:before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:4px;border-radius:4px;background:linear-gradient(var(--cy),#2a4bff)}
.c{background:linear-gradient(160deg,color-mix(in srgb,var(--card) 92%,#12d9ff),var(--card));box-shadow:0 8px 30px #0003;border-radius:16px}.c:hover{transform:translateY(-6px);box-shadow:0 18px 50px #12d9ff22}
.st div{background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 80%,#12d9ff));border-radius:16px}.st b{font-size:34px;background:linear-gradient(90deg,#12D9FF,#6f8bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.th:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#020b2d99)}
.rv{animation:up .8s both}.g>*{animation:up .6s both}@keyframes up{from{opacity:0;transform:translateY(18px)}}
@media(max-width:760px){.hg{grid-template-columns:1fr}.lg{order:-1}.lg img{width:190px}.ring{width:220px}.hero{padding:50px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

if(t=='videos')b=`<p><button onclick="vf()">+ Add video</button></p><div class="tb"><table>${DB.videos.map(v=>`<tr><td>${esc(v.title)}<br><span class="mu">${v.file?'📁 '+esc(v.fname)+' · '+(v.size/1048576).toFixed(1)+' MB (stored on this device)':esc(v.url||'no url')}</span></td><td>${v.published?'Published':'Draft'}</td><td><button class="s o" onclick="vf('${v.id}')">Edit</button> <button class="s d" onclick="del('videos','${v.id}')">Del</button></td></tr>`).join('')}</table></div>`;

if(t=='enq')b=`<p><button class="o" onclick="exp(DB.enquiries,'enquiries')">Export JSON</button></p>`+(DB.enquiries.map(e=>`<div class="c" style="margin-bottom:10px"><div class="b"><b>${esc(e.name)}</b> ${esc(e.company)} · ${esc(e.email)} · ${esc(e.phone||e.wa)}<br><span class="mu">${esc(e.product)} · ${esc(e.industry)} · ${esc(e.budget)} · ${new Date(e.date).toLocaleDateString()}</span><p>${esc(e.msg)}</p><select onchange="en('${e.id}','status',this.value)">${['New','Contacted','Interested','Demo Scheduled','Converted','Closed'].map(s=>`<option ${e.status==s?'selected':''}>${s}</option>`).join('')}</select><textarea placeholder="Internal notes" onchange="en('${e.id}','notes',this.value)">${esc(e.notes)}</textarea><button class="s d" onclick="del('enquiries','${e.id}')">Delete</button></div></div>`).join('')||'<p class="mu">No enquiries yet.</p>');
if(t=='set')b=`<p class="mu">Founder: taqvion91@gmail.com</p><button class="o" onclick="cp()">Change password</button> <button class="o" onclick="exp(DB,'backup')">Backup data</button> <button class="d" onclick="if(confirm('Reset all data to defaults?')){DB=seed();save();admin()}">Reset demo data</button><p class="mu">Data is stored in this browser only. See notes about connecting Supabase for multi-device persistence.</p>`;

function exp(o,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='taqvion-'+n+'.json';a.click()}

function tg(id,k){const p=DB.projects.find(x=>x.id==id);p[k]=!p[k];save();admin()}

async function cp(){const n=prompt('New password (min 8 chars)');if(n&&n.length>=8){localStorage.setItem('tqv_auth',JSON.stringify({email:'taqvion91@gmail.com',h:await sha(n)}));alert('Password changed')}}
function img(f){return new Promise(r=>{const x=new FileReader;x.onload=()=>{const i=new Image;i.onload=()=>{const s=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=x.result};x.readAsDataURL(f)})}
async function up(fs){for(const f of fs)DB.images.push({id:uid('i'),src:await img(f),cap:f.name.replace(/\.\w+$/,''),alt:'',proj:$('#ip').value});try{save()}catch(e){alert('Storage full – delete some images.')}admin()}
function form(title,F,v,cb){$('#mo').innerHTML=`<div class="md"><div><h3>${title}</h3><form id="mf">${F.map(f=>`<label>${f[1]}</label>${f[2]=='t'?`<textarea name="${f[0]}" rows="3">${esc(v[f[0]])}</textarea>`:f[2]=='c'?`<select name="${f[0]}">${CATS.map(c=>`<option ${v[f[0]]==c?'selected':''}>${c}</option>`).join('')}</select>`:f[2]=='p'?`<select name="${f[0]}"><option value="">None</option>${DB.projects.map(p=>`<option value="${p.id}" ${v[f[0]]==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:f[2]=='v'?`<input type="file" name="${f[0]}" accept="video/*,.mp4,.webm,.mov,.mkv">`:f[2]=='f'?`<input type="file" name="${f[0]}" accept="image/*">`:`<input name="${f[0]}" value="${esc(v[f[0]])}">`}`).join('')}<label><input type="checkbox" name="published" style="width:auto" ${v.published!==false?'checked':''}> Published</label><p><button>Save</button> <button type="button" class="o" onclick="$('#mo').innerHTML=''">Cancel</button></p></form></div></div>`;$('#mf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={};for(const[k,x]of fd)o[k]=x;o.published=!!fd.get('published');for(const f of F)if(f[2]=='f'){o[f[0]]=o[f[0]]&&o[f[0]].size?await img(o[f[0]]):v[f[0]]||''}try{await cb(o)}catch(x){alert('Upload failed: '+x.message);$('#mf button').textContent='Retry save';return}try{save()}catch(x){alert('Storage full')}$('#mo').innerHTML='';admin()}}
function pf(id){const p=DB.projects.find(x=>x.id==id)||{published:false,tech:[],features:[]};form(id?'Edit project':'New project',[['name','Name'],['cat','Category','c'],['industry','Industry'],['short','Short description'],['full','Full description','t'],['problem','Problem','t'],['solution','Solution','t'],['features','Features (comma separated)'],['tech','Technologies (comma separated)'],['demo','Demo URL'],['status','Status'],['cover','Cover image','f']],{...p,features:p.features.join(', '),tech:p.tech.join(', ')},o=>{o.features=o.features.split(',').map(s=>s.trim()).filter(Boolean);o.tech=o.tech.split(',').map(s=>s.trim()).filter(Boolean);if(id)Object.assign(p,o);else DB.projects.unshift({id:uid('p'),featured:false,views:0,hue:30,date:Date.now(),...o})})}
function vf(id){const v=DB.videos.find(x=>x.id==id)||{published:true};form(id?'Edit video':'Add video',[['title','Title'],['product','Product name'],['desc','Description','t'],['vfile','Upload video from your gallery / computer (MP4, WebM, MOV – any size your browser allows)','v'],['url','…or paste a video URL (YouTube, Vimeo, MP4 link)'],['thumb','Thumbnail image (optional)','f'],['cat','Video category'],['proj','Associated project','p']],v,async o=>{const f=o.vfile;delete o.vfile;if(f&&f.size){if(!/^video\//.test(f.type)&&!/\.(mp4|webm|mov|mkv)$/i.test(f.name))throw new Error('Please choose a video file');$('#mf button').textContent='Saving '+(f.size/1048576).toFixed(1)+' MB…';const rid=id||uid('v');await vput(rid,f);const x={file:true,size:f.size,fname:f.name};if(id)Object.assign(v,o,x);else DB.videos.unshift({id:rid,featured:false,date:Date.now(),...o,...x});return}if(id)Object.assign(v,o);else DB.videos.unshift({id:uid('v'),featured:false,date:Date.now(),...o})})}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('tqv_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function vput(id,b){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('v','readwrite');t.objectStore('v').put(b,id);t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error||new Error('Not enough browser storage'))})}
async function vget(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('v').objectStore('v').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function vdel(id){try{const d=await idb();d.transaction('v','readwrite').objectStore('v').delete(id)}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const io=new IntersectionObserver(es=>es.forEach(async e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const b=await vget(e.target.dataset.vid).catch(()=>null);if(b)e.target.src=URL.createObjectURL(b);else e.target.outerHTML='<div class="vid mu" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:10px">Video file is stored on the Founder\'s device only</div>'}),{rootMargin:'200px'});
